# Estacao nativa no Mac: MQTT restrito ao loopback.
# A Pi acessa este broker por tunel SSH reverso; nao ha listener MQTT na LAN.
listener 1883 127.0.0.1
allow_anonymous true
persistence false
connection_messages true
log_dest stdout
log_type error
log_type warning
log_type notice
message_size_limit 16384
max_queued_messages 100
